<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Acid–Base Titration Animation</title>  <style>    :root {      --blue: #1976d2;      --glass: rgba(220, 240, 255, 0.28);      --solution: #f2a6d2;    }    * {      box-sizing: border-box;    }    body {      margin: 0;      min-height: 100vh;      display: grid;      place-items: center;      font-family: Arial, sans-serif;      background: linear-gradient(#edf7ff, #d8ecfa);      color: #17324d;    }    .scene {      width: min(900px, 96vw);      padding: 24px;      text-align: center;      background: rgba(255, 255, 255, 0.72);      border-radius: 18px;      box-shadow: 0 12px 35px rgba(45, 92, 130, 0.18);    }    h1 {      margin: 0 0 8px;    }    p {      margin: 6px 0 20px;    }    .lab {      position: relative;      height: 480px;      overflow: hidden;      border-radius: 12px;      background:        linear-gradient(          90deg,          transparent 49.8%,          #d8e5ee 50%,          transparent 50.2%        ),        #f9fcff;      border: 2px solid #c4dbe9;    }    /*      The flask neck is centered at approximately x = 475px.      The burette tip is also centered at x = 475px.    */    .stand {      position: absolute;      left: 349px;      top: 35px;      width: 12px;      height: 365px;      background: #536b7b;      border-radius: 8px;    }    .base {      position: absolute;      left: 297px;      top: 390px;      width: 115px;      height: 16px;      border-radius: 10px;      background: #536b7b;    }    .clamp {      position: absolute;      left: 349px;      top: 80px;      width: 120px;      height: 12px;      background: #536b7b;      border-radius: 8px;    }    .burette {      position: absolute;      left: 454px;      top: 45px;      width: 42px;      height: 260px;      border: 3px solid #65889d;      border-radius: 8px 8px 3px 3px;      background: linear-gradient(        to top,        #78b9ed 0%,        #78b9ed 78%,        rgba(255, 255, 255, 0.65) 78%,        rgba(255, 255, 255, 0.65) 100%      );    }    .burette::before {      content: "NaOH";      position: absolute;      top: -28px;      left: -3px;      font-weight: bold;      color: #1769aa;    }    .burette::after {      content: "50";      position: absolute;      right: -28px;      bottom: 4px;      color: #4f7184;      font-size: 12px;    }    .stopcock {      position: absolute;      left: 460px;      top: 303px;      width: 30px;      height: 13px;      border-radius: 5px;      background: #4b6573;    }    .tip {      position: absolute;      left: 471px;      top: 315px;      width: 8px;      height: 35px;      background: #6f8795;    }    .drop {      position: absolute;      left: 468px;      top: 347px;      width: 13px;      height: 18px;      border-radius: 60% 60% 65% 65%;      background: #368bd0;      opacity: 0;    }    .flask {      position: absolute;      left: 350px;      bottom: 45px;      width: 250px;      height: 220px;    }    .neck {      position: absolute;      left: 90px;      top: 0;      width: 70px;      height: 85px;      border: 4px solid #6c91a4;      border-bottom: 0;      background: var(--glass);    }    .body {      position: absolute;      bottom: 0;      width: 250px;      height: 160px;      clip-path: polygon(        37% 0,        63% 0,        70% 25%,        100% 100%,        0 100%,        30% 25%      );      border: 4px solid #6c91a4;      background: var(--glass);    }    .liquid {      position: absolute;      z-index: 2;      left: 28px;      bottom: 8px;      width: 194px;      height: 70px;      clip-path: polygon(        15% 0,        85% 0,        100% 100%,        0 100%      );      border-radius: 0 0 50px 50px;      background: var(--solution);      transition:        height 0.3s,        background 0.3s;    }    .swirl {      position: absolute;      z-index: 3;      left: 67px;      bottom: 50px;      width: 115px;      height: 28px;      border: 3px solid rgba(255, 255, 255, 0.7);      border-left-color: transparent;      border-right-color: transparent;      border-radius: 50%;      opacity: 0;    }    .particle {      position: absolute;      z-index: 4;      width: 6px;      height: 6px;      border-radius: 50%;      background: rgba(255, 255, 255, 0.8);      animation: drift 2s infinite ease-in-out;    }    .p1 {      left: 75px;      bottom: 65px;    }    .p2 {      left: 125px;      bottom: 85px;      animation-delay: 0.4s;    }    .p3 {      left: 160px;      bottom: 50px;      animation-delay: 0.8s;    }    @keyframes fall {      0% {        transform: translateY(0);        opacity: 1;      }      100% {        transform: translateY(110px);        opacity: 0;      }    }    @keyframes drift {      0%,      100% {        transform: translate(0, 0);      }      50% {        transform: translate(18px, -10px);      }    }    @keyframes swirl {      0% {        transform: rotate(0deg) scale(0.8);        opacity: 0;      }      35% {        opacity: 1;      }      100% {        transform: rotate(360deg) scale(1.15);        opacity: 0;      }    }    .readout {      margin-top: 14px;      font-size: 18px;    }    .meter {      position: relative;      width: 80%;      height: 16px;      margin: 12px auto;      border-radius: 12px;      background: linear-gradient(        90deg,        #e889b9,        #f0d889,        #9380dd      );    }    .marker {      position: absolute;      top: -6px;      left: 0%;      width: 4px;      height: 28px;      background: #172b3b;      transition: left 0.3s;    }    button {      padding: 10px 22px;      border: 0;      border-radius: 8px;      background: var(--blue);      color: white;      font-size: 16px;      cursor: pointer;    }    button:hover {      background: #125ca7;    }  </style></head><body>  <main class="scene">    <h1>Strong Acid–Strong Base Titration</h1>    <p>NaOH is added to HCl containing phenolphthalein indicator.</p>    <section class="lab">      <div class="stand"></div>      <div class="base"></div>      <div class="clamp"></div>      <div class="burette"></div>      <div class="stopcock"></div>      <div class="tip"></div>      <div class="drop"></div>      <div class="flask">        <div class="neck"></div>        <div class="body"></div>        <div class="liquid"></div>        <div class="swirl"></div>        <i class="particle p1"></i>        <i class="particle p2"></i>        <i class="particle p3"></i>      </div>    </section>    <div class="readout">      Added NaOH:      <span id="volume">0.0</span> mL      &nbsp; | &nbsp;      Approx. pH:      <span id="ph">1.0</span>    </div>    <div class="meter">      <div class="marker" id="marker"></div>    </div>    <button id="start">Start titration</button>  </main>  <script>    const drop = document.querySelector(".drop");    const liquid = document.querySelector(".liquid");    const swirl = document.querySelector(".swirl");    const volumeText = document.querySelector("#volume");    const phText = document.querySelector("#ph");    const marker = document.querySelector("#marker");    const button = document.querySelector("#start");    let timer;    let volume = 0;    function update() {      const equivalence = 25;      const concentration = Math.min(volume / 50, 1);      let pH;      if (volume < equivalence) {        pH = Math.max(1, 1 + 2.3 * volume / equivalence);      } else if (volume === equivalence) {        pH = 7;      } else {        pH = Math.min(          13,          7 + 5.2 * (volume - equivalence) / 25        );      }      volumeText.textContent = volume.toFixed(1);      phText.textContent = pH.toFixed(1);      marker.style.left = `${(pH / 14) * 100}%`;      liquid.style.height = `${70 + concentration * 35}px`;      if (pH < 7) {        liquid.style.background = "#efa5ca";      } else if (pH < 8.5) {        liquid.style.background = "#e8a9d1";      } else {        liquid.style.background = "#b69ae8";      }    }    function animateDrop() {      drop.style.animation = "none";      void drop.offsetWidth;      drop.style.animation = "fall 0.75s linear";      swirl.style.animation = "swirl 0.9s ease-out";      setTimeout(() => {        swirl.style.animation = "none";      }, 900);    }    button.addEventListener("click", () => {      clearInterval(timer);      volume = 0;      update();      button.textContent = "Titrating…";      timer = setInterval(() => {        volume += 0.5;        animateDrop();        update();        if (volume >= 50) {          clearInterval(timer);          button.textContent = "Restart titration";        }      }, 180);    });    update();  </script></body></html>
