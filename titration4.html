<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Interactive Titration Animation</title>  <style>    :root {      --blue: #1976d2;      --dark-blue: #24556f;      --glass-border: #5f879d;      --solution: #efa5ca;    }    * {      box-sizing: border-box;    }    body {      margin: 0;      min-height: 100vh;      display: grid;      place-items: center;      font-family: Arial, sans-serif;      color: #17324d;      background: linear-gradient(#edf7ff, #d8ecfa);    }    .scene {      width: min(1200px, 96vw);      padding: 24px;      text-align: center;      background: rgba(255, 255, 255, 0.8);      border-radius: 18px;      box-shadow: 0 12px 35px rgba(45, 92, 130, 0.18);    }    h1 {      margin: 0 0 8px;    }    p {      margin: 6px 0 20px;    }    .lab {      position: relative;      width: 1100px;      max-width: 100%;      height: 560px;      margin: auto;      overflow: hidden;      border: 2px solid #c4dbe9;      border-radius: 12px;      background:        linear-gradient(#ffffffaa, #ffffffaa),        repeating-linear-gradient(          0deg,          transparent 0,          transparent 39px,          #e6f0f6 40px        );    }    /* Retort stand */    .stand {      position: absolute;      left: 164px;      top: 38px;      width: 12px;      height: 425px;      z-index: 1;      background: #536b7b;      border-radius: 8px;    }    .base {      position: absolute;      left: 112px;      top: 452px;      width: 115px;      height: 17px;      z-index: 1;      border-radius: 10px;      background: #536b7b;    }    .clamp {      position: absolute;      left: 164px;      top: 82px;      width: 120px;      height: 12px;      z-index: 2;      background: #536b7b;      border-radius: 8px;    }    /* Raised buret */    .burette {      position: absolute;      left: 269px;      top: 38px;      width: 42px;      height: 215px;      z-index: 3;      border: 3px solid #65889d;      border-radius: 8px 8px 3px 3px;      background: linear-gradient(        to top,        #78b9ed 0%,        #78b9ed 78%,        rgba(255, 255, 255, 0.7) 78%,        rgba(255, 255, 255, 0.7) 100%      );    }    .burette::before {      content: "NaOH";      position: absolute;      top: -28px;      left: -3px;      font-weight: bold;      color: #1769aa;    }    .burette::after {      content: "50 mL";      position: absolute;      right: -43px;      bottom: 5px;      color: #4f7184;      font-size: 12px;    }    /*      The stopcock is positioned just above the flask neck.      It is closed by default and opens when the "open" class is added.    */    .stopcock {      position: absolute;      left: 275px;      top: 250px;      width: 30px;      height: 14px;      z-index: 5;      border-radius: 5px;      background: #4b6573;    }    .stopcock::before {      content: "";      position: absolute;      left: -8px;      top: 4px;      width: 46px;      height: 5px;      border-radius: 5px;      background: #344b58;      transform-origin: center;      transform: rotate(90deg);      transition: transform 0.35s ease;    }    .stopcock.open::before {      transform: rotate(0deg);    }    .tip {      position: absolute;      left: 286px;      top: 263px;      width: 8px;      height: 32px;      z-index: 4;      background: #6f8795;    }    .drop {      position: absolute;      left: 283px;      top: 291px;      width: 13px;      height: 18px;      z-index: 8;      border-radius: 60% 60% 65% 65%;      background: #368bd0;      opacity: 0;    }    /* Flask */    .flask {      position: absolute;      left: 145px;      top: 288px;      width: 300px;      height: 235px;      z-index: 2;    }    .flask-svg {      width: 100%;      height: 100%;      overflow: visible;    }    .glass {      fill: rgba(215, 239, 250, 0.38);      stroke: var(--glass-border);      stroke-width: 4;      stroke-linejoin: round;    }    .liquid {      fill: var(--solution);      opacity: 0.9;      transition:        y 0.3s,        height 0.3s,        fill 0.3s;    }    .liquid-surface {      fill: none;      stroke: rgba(255, 255, 255, 0.75);      stroke-width: 3;      stroke-linecap: round;      transition: transform 0.3s;    }    .bubble {      fill: rgba(255, 255, 255, 0.75);      animation: drift 2s infinite ease-in-out;    }    .bubble.delay-1 {      animation-delay: 0.4s;    }    .bubble.delay-2 {      animation-delay: 0.8s;    }    /* Graph */    .graph-panel {      position: absolute;      left: 610px;      top: 42px;      width: 450px;      height: 430px;      padding: 10px 12px;      border: 1px solid #c2d8e5;      border-radius: 12px;      background: rgba(255, 255, 255, 0.9);      box-shadow: 0 5px 15px rgba(62, 107, 135, 0.1);    }    .graph-title {      margin: 0 0 4px;      font-weight: bold;      color: #214e6c;    }    .graph {      width: 100%;      height: 370px;    }    .axis {      stroke: #294b5c;      stroke-width: 2;    }    .grid-line {      stroke: #dbe8ef;      stroke-width: 1;    }    .tick-label,    .axis-label {      fill: #294b5c;      font-size: 12px;    }    .axis-label {      font-size: 14px;      font-weight: bold;    }    #curve {      fill: none;      stroke: #c23b83;      stroke-width: 4;      stroke-linecap: round;      stroke-linejoin: round;    }    #currentPoint {      fill: #1976d2;      stroke: white;      stroke-width: 2;    }    #currentGuide {      stroke: #1976d2;      stroke-width: 1.5;      stroke-dasharray: 5 4;      opacity: 0.65;    }    .readout {      margin-top: 14px;      font-size: 18px;    }    .meter {      position: relative;      width: min(500px, 80%);      height: 16px;      margin: 12px auto;      border-radius: 12px;      background: linear-gradient(        90deg,        #e889b9,        #f0d889,        #9380dd      );    }    .marker {      position: absolute;      top: -6px;      left: 0%;      width: 4px;      height: 28px;      background: #172b3b;      transition: left 0.3s;    }    button {      padding: 10px 22px;      border: 0;      border-radius: 8px;      background: var(--blue);      color: white;      font-size: 16px;      cursor: pointer;    }    button:hover {      background: #125ca7;    }    @keyframes fall {      0% {        transform: translateY(0);        opacity: 1;      }      100% {        transform: translateY(105px);        opacity: 0;      }    }    @keyframes swirl {      0% {        transform: rotate(0deg) scale(0.8);        opacity: 0;      }      35% {        opacity: 1;      }      100% {        transform: rotate(360deg) scale(1.15);        opacity: 0;      }    }    @keyframes drift {      0%,      100% {        transform: translate(0, 0);      }      50% {        transform: translate(12px, -9px);      }    }  </style></head><body>  <main class="scene">    <h1>Strong Acid–Strong Base Titration</h1>    <p>NaOH is added to HCl containing phenolphthalein indicator.</p>    <section class="lab">      <div class="stand"></div>      <div class="base"></div>      <div class="clamp"></div>      <div class="burette"></div>      <div class="stopcock" id="stopcock"></div>      <div class="tip"></div>      <div class="drop"></div>      <div class="flask">        <svg class="flask-svg" viewBox="0 0 300 235">          <defs>            <clipPath id="flaskClip">              <path d="M110 8 H190 V86 L270 225 H30 L110 86 Z" />            </clipPath>            <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />              <stop offset="45%" stop-color="#c8e8f5" stop-opacity="0.25" />              <stop offset="100%" stop-color="#8fc6df" stop-opacity="0.4" />            </linearGradient>            <linearGradient id="liquidGradient" x1="0" y1="0" x2="0" y2="1">              <stop offset="0%" stop-color="#f7c2df" />              <stop offset="100%" stop-color="#df83b7" />            </linearGradient>          </defs>          <!-- Flask liquid, clipped to the flask shape -->          <rect            id="liquid"            class="liquid"            x="25"            y="166"            width="250"            height="65"            fill="url(#liquidGradient)"            clip-path="url(#flaskClip)"          />          <path            id="liquidSurface"            class="liquid-surface"            d="M48 166 Q150 153 252 166"          />          <!-- Moving bubbles -->          <circle class="bubble" cx="105" cy="188" r="4" />          <circle class="bubble delay-1" cx="155" cy="205" r="3" />          <circle class="bubble delay-2" cx="202" cy="181" r="4" />          <!-- Flask glass -->          <path            class="glass"            fill="url(#glassGradient)"            d="M110 8 H190 V86 L270 225 H30 L110 86 Z"          />          <!-- Flask rim -->          <path            d="M103 8 H197"            stroke="#5f879d"            stroke-width="6"            stroke-linecap="round"          />          <!-- Flask highlight -->          <path            d="M77 135 L47 202"            stroke="rgba(255,255,255,0.7)"            stroke-width="7"            stroke-linecap="round"          />        </svg>      </div>      <section class="graph-panel">        <div class="graph-title">Titration Curve</div>        <svg          class="graph"          viewBox="0 0 430 370"          role="img"          aria-label="Graph of pH versus volume of titrant added"        >          <!-- Horizontal grid lines -->          <line class="grid-line" x1="55" y1="25" x2="405" y2="25" />          <line class="grid-line" x1="55" y1="70" x2="405" y2="70" />          <line class="grid-line" x1="55" y1="115" x2="405" y2="115" />          <line class="grid-line" x1="55" y1="160" x2="405" y2="160" />          <line class="grid-line" x1="55" y1="205" x2="405" y2="205" />          <line class="grid-line" x1="55" y1="250" x2="405" y2="250" />          <!-- Vertical grid lines -->          <line class="grid-line" x1="55" y1="25" x2="55" y2="250" />          <line class="grid-line" x1="125" y1="25" x2="125" y2="250" />          <line class="grid-line" x1="195" y1="25" x2="195" y2="250" />          <line class="grid-line" x1="265" y1="25" x2="265" y2="250" />          <line class="grid-line" x1="335" y1="25" x2="335" y2="250" />          <line class="grid-line" x1="405" y1="25" x2="405" y2="250" />          <!-- Axes -->          <line class="axis" x1="55" y1="250" x2="405" y2="250" />          <line class="axis" x1="55" y1="25" x2="55" y2="250" />          <!-- Y-axis labels -->          <text class="tick-label" x="34" y="254">0</text>          <text class="tick-label" x="34" y="209">3</text>          <text class="tick-label" x="34" y="164">6</text>          <text class="tick-label" x="34" y="119">9</text>          <text class="tick-label" x="27" y="74">12</text>          <text class="tick-label" x="27" y="29">15</text>          <!-- X-axis labels -->          <text class="tick-label" x="51" y="270">0</text>          <text class="tick-label" x="119" y="270">10</text>          <text class="tick-label" x="189" y="270">20</text>          <text class="tick-label" x="259" y="270">30</text>          <text class="tick-label" x="329" y="270">40</text>          <text class="tick-label" x="399" y="270">50</text>          <!-- Axis titles -->          <text class="axis-label" x="190" y="310">            Volume of titrant added (mL)          </text>          <text            class="axis-label"            transform="translate(15 175) rotate(-90)"          >            pH          </text>          <!-- Dynamic guide, curve, and current point -->          <line id="currentGuide" x1="55" y1="250" x2="55" y2="250" />          <path id="curve" d="" />          <circle id="currentPoint" cx="55" cy="235" r="6" />        </svg>      </section>    </section>    <div class="readout">      Added NaOH:      <span id="volume">0.0</span> mL      &nbsp; | &nbsp;      Approx. pH:      <span id="ph">1.0</span>    </div>    <div class="meter">      <div class="marker" id="marker"></div>    </div>    <button id="start">Start titration</button>  </main>  <script>    const drop = document.querySelector(".drop");    const liquid = document.querySelector("#liquid");    const liquidSurface = document.querySelector("#liquidSurface");    const stopcock = document.querySelector("#stopcock");    const curve = document.querySelector("#curve");    const currentPoint = document.querySelector("#currentPoint");    const currentGuide = document.querySelector("#currentGuide");    const volumeText = document.querySelector("#volume");    const phText = document.querySelector("#ph");    const marker = document.querySelector("#marker");    const button = document.querySelector("#start");    let timer = null;    let volume = 0;    let state = "idle";    const graph = {      left: 55,      right: 405,      top: 25,      bottom: 250,      maxVolume: 50,      maxPH: 15    };    function calculatePH(volume) {      const equivalencePoint = 25;      if (volume < equivalencePoint) {        return Math.max(1, 1 + 2.3 * volume / equivalencePoint);      }      if (volume === equivalencePoint) {        return 7;      }      return Math.min(        14,        7 + 5.2 * (volume - equivalencePoint) / 25      );    }    function volumeToX(volumeValue) {      return graph.left +        (volumeValue / graph.maxVolume) *        (graph.right - graph.left);    }    function phToY(phValue) {      return graph.bottom -        (phValue / graph.maxPH) *        (graph.bottom - graph.top);    }    function updateGraph() {      const points = [];      /*        Draw the curve only up to the amount currently added,        so the graph grows with each titrant addition.      */      for (let v = 0; v <= volume; v += 0.25) {        const pH = calculatePH(v);        points.push(`${volumeToX(v)},${phToY(pH)}`);      }      if (points.length === 1) {        points.push(points[0]);      }      curve.setAttribute("d", `M ${points.join(" L ")}`);      const currentPH = calculatePH(volume);      const x = volumeToX(volume);      const y = phToY(currentPH);      currentPoint.setAttribute("cx", x);      currentPoint.setAttribute("cy", y);      currentGuide.setAttribute("x1", x);      currentGuide.setAttribute("x2", x);      currentGuide.setAttribute("y1", graph.bottom);      currentGuide.setAttribute("y2", y);    }    function updateDisplay() {      const pH = calculatePH(volume);      const concentration = Math.min(volume / 50, 1);      volumeText.textContent = volume.toFixed(1);      phText.textContent = pH.toFixed(1);      marker.style.left = `${(pH / 14) * 100}%`;      /*        Increase the liquid level as titrant is added.        SVG coordinates increase downward, so the y-coordinate decreases.      */      const liquidHeight = 55 + concentration * 40;      const liquidY = 225 - liquidHeight;      liquid.setAttribute("y", liquidY);      liquid.setAttribute("height", liquidHeight);      liquidSurface.setAttribute(        "transform",        `translate(0 ${liquidY - 166})`      );      if (pH < 7) {        liquid.setAttribute("fill", "#efa5ca");      } else if (pH < 8.5) {        liquid.setAttribute("fill", "#e8a9d1");      } else {        liquid.setAttribute("fill", "#b69ae8");      }      updateGraph();    }    function animateDrop() {      drop.style.animation = "none";      void drop.offsetWidth;      drop.style.animation = "fall 0.75s linear";    }    function animateSwirl() {      liquidSurface.style.animation = "none";      void liquidSurface.offsetWidth;      liquidSurface.style.animation = "swirl 0.9s ease-out";    }    function openStopcock() {      stopcock.classList.add("open");    }    function closeStopcock() {      stopcock.classList.remove("open");    }    function beginAddingTitrant() {      state = "running";      openStopcock();      button.textContent = "Pause titration";      timer = setInterval(() => {        volume += 0.5;        animateDrop();        animateSwirl();        updateDisplay();        if (volume >= 50) {          finishTitration();        }      }, 180);    }    function pauseTitration() {      clearInterval(timer);      timer = null;      state = "paused";      closeStopcock();      button.textContent = "Resume titration";    }    function finishTitration() {      clearInterval(timer);      timer = null;      state = "finished";      volume = 50;      updateDisplay();      closeStopcock();      button.textContent = "Restart titration";    }    function restartTitration() {      clearInterval(timer);      timer = null;      volume = 0;      updateDisplay();      beginAddingTitrant();    }    button.addEventListener("click", () => {      if (state === "idle") {        beginAddingTitrant();      } else if (state === "running") {        pauseTitration();      } else if (state === "paused") {        beginAddingTitrant();      } else if (state === "finished") {        restartTitration();      }    });    updateDisplay();    closeStopcock();  </script></body></html>
